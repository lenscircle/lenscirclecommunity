
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6f2">

  <title>Reset Password | Lens Circle</title>
  <meta name="description" content="Securely reset your Lens Circle account password.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f7f6f2;
      --white: #fff;
      --ink: #252722;
      --muted: #777970;
      --line: #e7e4dc;
      --accent: #a85e42;
      --accent-dark: #85472f;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .navbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
    }

    .brand span {
      color: var(--accent);
    }

    .back-link {
      color: var(--muted);
      font-size: 12px;
    }

    .back-link:hover {
      color: var(--accent);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 55px 20px;
    }

    .card {
      width: 100%;
      max-width: 470px;
      background: var(--white);
      padding: 48px;
      border: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 17px;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 40px;
      line-height: 1.15;
      margin-bottom: 13px;
    }

    .description {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .password-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      padding: 14px;
      font-family: var(--sans);
      font-size: 12px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: var(--accent);
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit {
      width: 100%;
      padding: 16px;
      border: 0;
      background: var(--ink);
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit:hover {
      background: var(--accent);
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 13px;
      font-size: 11px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .status.error {
      display: block;
      color: #a33c2c;
      background: #fff2ef;
      border: 1px solid #efd0c8;
    }

    .status.success {
      display: block;
      color: #32633a;
      background: #eff7ef;
      border: 1px solid #cfe2cf;
    }

    .status.info {
      display: block;
      color: #71532e;
      background: #fbf5e9;
      border: 1px solid #e9dcc2;
    }

    .bottom-link {
      border-top: 1px solid var(--line);
      margin-top: 28px;
      padding-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    .bottom-link a {
      color: var(--accent);
      font-weight: 700;
    }

    footer {
      padding: 20px;
      text-align: center;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    @media(max-width: 520px) {
      .navbar {
        height: 66px;
        padding: 0 20px;
      }

      .brand {
        font-size: 23px;
      }

      .card {
        padding: 32px 24px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <a href="../index.html" class="brand">
      Lens <span>Circle</span>
    </a>

    <a href="login.html" class="back-link">
      ← Sign in
    </a>
  </header>

  <main>
    <section class="card">

      <div class="eyebrow">Account security</div>

      <h1>Choose a new password.</h1>

      <p class="description">
        Enter your new password below. You must open this page
        using the password recovery link sent to your registered
        email address.
      </p>

      <form id="resetForm">

        <div class="form-group">
          <label for="password">New password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              minlength="10"
              maxlength="72"
              placeholder="Enter your new password"
              required>

            <button type="button" class="toggle" data-target="password">
              SHOW
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              autocomplete="new-password"
              minlength="10"
              maxlength="72"
              placeholder="Enter your password again"
              required>

            <button type="button" class="toggle" data-target="confirmPassword">
              SHOW
            </button>
          </div>
        </div>

        <button type="submit" class="submit" id="submitButton">
          Update password →
        </button>

        <div
          class="status"
          id="statusMessage"
          role="status"
          aria-live="polite">
        </div>

      </form>

      <div class="bottom-link">
        Remember your password?
        <a href="login.html">Return to sign in</a>
      </div>

    </section>
  </main>

  <footer>
    © <span id="year"></span> Lens Circle. The world, through your lens.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Replace with your actual Supabase credentials.
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";

    const isConfigured =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("YOUR_SUPABASE") &&
      SUPABASE_ANON_KEY.length > 20 &&
      !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");

    let supabaseClient = null;

    if (isConfigured && window.supabase) {
      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    }

    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const submitButton = document.getElementById("submitButton");
    const statusMessage = document.getElementById("statusMessage");

    let recoveryReady = false;

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = "status " + type;
    }

    // Password visibility
    document.querySelectorAll(".toggle").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const visible = input.type === "password";

        input.type = visible ? "text" : "password";
        button.textContent = visible ? "HIDE" : "SHOW";
      });
    });

    // Match validation
    function validatePasswords() {
      confirmInput.setCustomValidity(
        confirmInput.value && confirmInput.value !== passwordInput.value
          ? "Passwords do not match."
          : ""
      );
    }

    passwordInput.addEventListener("input", validatePasswords);
    confirmInput.addEventListener("input", validatePasswords);

    async function initializeRecovery() {
      if (!supabaseClient) {
        showStatus(
          "Supabase is not configured. Add your project URL and publishable/anon key before using password recovery.",
          "error"
        );
        submitButton.disabled = true;
        return;
      }

      try {
        /*
          Supabase's recovery link establishes a temporary
          recovery session. The page waits for that session
          before enabling password changes.
        */

        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (data.session) {
          recoveryReady = true;
          showStatus(
            "Recovery session detected. You can now choose a new password.",
            "success"
          );
        } else {
          showStatus(
            "No active recovery session was found. Open the latest password reset link sent to your email.",
            "info"
          );
          submitButton.disabled = true;
        }

      } catch (error) {
        showStatus(
          error.message || "Unable to verify your recovery session.",
          "error"
        );
        submitButton.disabled = true;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!supabaseClient || !recoveryReady) {
        showStatus(
          "Your recovery session is not active. Request a new password reset link.",
          "error"
        );
        return;
      }

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (password.length < 10) {
        showStatus(
          "Your new password must contain at least 10 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showStatus("Your passwords do not match.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Updating password...";

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        recoveryReady = false;

        showStatus(
          "Your password has been updated successfully. Please sign in using your new password.",
          "success"
        );

        form.reset();

        setTimeout(() => {
          window.location.replace("login.html");
        }, 2500);

      } catch (error) {
        showStatus(
          error.message || "Unable to update your password.",
          "error"
        );

      } finally {
        if (recoveryReady) {
          submitButton.disabled = false;
          submitButton.textContent = "Update password →";
        }
      }
    });

    document.getElementById("year").textContent =
      new Date().getFullYear();

    initializeRecovery();
  </script>

</body>
</html>
