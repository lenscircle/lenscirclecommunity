<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lens Circle | Photo of the Day</title>
  <style>
    * { box-sizing: border-box; }
    <body>

    { margin: 0; background: #0b1020; color: #f4f6fb; font: 16px Arial, sans-serif; }
    header { padding: 20px 7%; border-bottom: 1px solid #283047; }
    h1, h2 { margin-top: 0; }
    main { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .intro { text-align: center; margin-bottom: 35px; }
    .intro p, .muted { color: #aeb7ca; }
    .panel { background: #141b2e; border: 1px solid #283047; border-radius: 12px; padding: 22px; margin-bottom: 30px; }
    form { display: grid; gap: 12px; }
    input, button { font: inherit; border-radius: 6px; padding: 12px; }
    input { background: #0b1020; color: white; border: 1px solid #424b62; width: 100%; }
    button { border: 0; background: #d4af37; color: #111624; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    .card { background: #141b2e; border: 1px solid #283047; border-radius: 10px; overflow: hidden; }
    .card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
    .card-content { padding: 15px; }
    .card h3 { margin: 0 0 6px; overflow-wrap: anywhere; }
    .card p { color: #aeb7ca; margin: 0 0 12px; overflow-wrap: anywhere; }
    .vote-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .vote-row button { padding: 9px 14px; }
    #status { min-height: 24px; color: #d4af37; }
    footer { text-align: center; padding: 25px; color: #8791a8; border-top: 1px solid #283047; }
  </style>
</head>
  <header><strong>LENS CIRCLE</strong></header>

  <main>
    <div class="intro">
      <h1>Photo of the Day</h1>
      <p>Share your photograph and vote for your favourites.</p>
    </div>

    <section class="panel">
      <h2>Submit your photo</h2>
      <form id="uploadForm">
        <input id="photographer" placeholder="Your name or Instagram username" required maxlength="80">
        <input id="title" placeholder="Photo title" required maxlength="120">
        <input id="photoFile" type="file" accept="image/*" required>
        <button id="submitButton" type="submit">Upload photo</button>
        <div id="status" role="status"></div>
      </form>
    </section>

    <section>
      <h2>Community gallery</h2>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <footer>© Lens Circle Community</footer>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://cmqxweqbepfsslghxaog.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9UdYM-0Csw-RMv1FTRJqLQ_U6G704SI";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const bucket = "pod-photos";

    let voterToken = localStorage.getItem("lenscircle-voter-token");
    if (!voterToken) {
      voterToken = crypto.randomUUID();
      localStorage.setItem("lenscircle-voter-token", voterToken);
    }

    const form = document.querySelector("#uploadForm");
    const status = document.querySelector("#status");
    const submitButton = document.querySelector("#submitButton");
    const gallery = document.querySelector("#gallery");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      submitButton.disabled = true;

      try {
        const photographer = document.querySelector("#photographer").value.trim();
        const title = document.querySelector("#title").value.trim();
        const file = document.querySelector("#photoFile").files[0];

        if (!file || !file.type.startsWith("image/")) {
          throw new Error("Please choose an image file.");
        }
        if (file.size > 5 * 1024 * 1024) {
          throw new Error("Please use an image smaller than 5 MB.");
        }

        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const path = `${crypto.randomUUID()}-${safeName}`;

        const { error: uploadError } = await supabase.storage
          .from(bucket)
          .upload(path, file, { contentType: file.type });

        if (uploadError) throw uploadError;

        const { data: publicData } = supabase.storage.from(bucket).getPublicUrl(path);

        const { error: insertError } = await supabase.from("photos").insert({
          photographer,
          title,
          image_path: publicData.publicUrl
        });

        if (insertError) throw insertError;

        form.reset();
        status.textContent = "Photo uploaded!";
        await loadPhotos();
      } catch (error) {
        status.textContent = error.message || "Upload failed. Please try again.";
      } finally {
        submitButton.disabled = false;
      }
    });

    async function vote(photoId, button) {
      button.disabled = true;
      try {
        const { error } = await supabase.rpc("cast_vote", {
          p_photo_id: photoId,
          p_voter_token: voterToken
        });
        if (error) throw error;
        await loadPhotos();
      } catch (error) {
        alert(error.message || "Could not record your vote.");
      } finally {
        button.disabled = false;
      }
    }

    async function loadPhotos() {
      const { data, error } = await supabase
        .from("photos")
        .select("id, photographer, title, image_path, votes, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        gallery.textContent = "Could not load photos. Check your Supabase setup.";
        return;
      }

      gallery.replaceChildren();

      for (const photo of data) {
        const card = document.createElement("article");
        card.className = "card";

        const image = document.createElement("img");
        image.src = photo.image_path;
        image.alt = photo.title;
        image.loading = "lazy";

        const content = document.createElement("div");
        content.className = "card-content";

        const title = document.createElement("h3");
        title.textContent = photo.title;

        const photographer = document.createElement("p");
        photographer.textContent = `By ${photo.photographer}`;

        const row = document.createElement("div");
        row.className = "vote-row";

        const count = document.createElement("span");
        count.textContent = `${photo.votes} vote${photo.votes === 1 ? "" : "s"}`;

        const button = document.createElement("button");
        button.textContent = "Vote";
        button.addEventListener("click", () => vote(photo.id, button));

        row.append(count, button);
        content.append(title, photographer, row);
        card.append(image, content);
        gallery.append(card);
      }
    }

    await loadPhotos();
    setInterval(loadPhotos, 5000);
  </script>
</body>
</html>
